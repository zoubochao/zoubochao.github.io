# Times New Roman Font Set
#
# To use this font set, set `font = "times_new_roman"` in `config/_default/params.yaml`.

# Font families
heading_font = "Times New Roman, serif"
body_font = "Times New Roman, serif"
nav_font = "Times New Roman, serif"
mono_font = "SFMono-Regular, Menlo, Monaco, Consolas, \"Liberation Mono\", \"Courier New\", monospace"